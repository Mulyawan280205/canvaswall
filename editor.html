<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanvasWall - Editor Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Bagian Kiri: Canvas Editor -->
        <div class="canvas-container">
            <canvas id="canvasWall" width="1000" height="1000"></canvas>
        </div>

        <!-- Bagian Kanan: Panel Kontrol Editor -->
        <div class="control-panel">
            <h1>Panel Editor</h1>
            <p class="subtitle">Drag di canvas untuk memilih area & pasang banner.</p>
            
            <div class="info-box">
                <h3>Cara Kerja Editor:</h3>
                <ol>
                    <li><strong>Drag</strong> mouse di canvas untuk memilih ukuran & koordinat.</li>
                    <li>Upload gambar banner & isi link tujuan.</li>
                    <li><strong>Klik iklan di canvas</strong> jika ingin menghapusnya.</li>
                </ol>
            </div>

            <form id="adForm">
                <div class="input-group">
                    <label>Koordinat X:</label>
                    <input type="number" id="coordX" value="0" readonly>
                </div>
                <div class="input-group">
                    <label>Koordinat Y:</label>
                    <input type="number" id="coordY" value="0" readonly>
                </div>
                <div class="input-group">
                    <label>Lebar (Width - Pixel):</label>
                    <input type="number" id="widthPixel" value="100" min="10" max="1000">
                </div>
                <div class="input-group">
                    <label>Tinggi (Height - Pixel):</label>
                    <input type="number" id="heightPixel" value="100" min="10" max="1000">
                </div>
                <div class="input-group">
                    <label>File Gambar Banner:</label>
                    <input type="file" id="adImageFile" accept="image/*" required>
                </div>
                <div class="input-group">
                    <label>URL Link Tujuan Iklan:</label>
                    <input type="url" id="adLink" placeholder="https://website-anda.com" required>
                </div>

                <div class="price-tag">
                    Total Biaya: <span id="totalPrice">$10,000</span>
                </div>

                <button type="submit" class="btn-buy">Pasang Banner Iklan</button>
            </form>
        </div>
    </div>

    <!-- Gunakan file script.js yang sama -->
    <script src="script.js"></script>
</body>
</html>
